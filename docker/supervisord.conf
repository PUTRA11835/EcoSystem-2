; Menjalankan php-fpm DAN queue worker Laravel (Word Report Generator, dst)
; di dalam SATU container yang sama -- supaya deploy tetap "rebuild + restart
; satu container" seperti sekarang, tanpa perlu container/service tambahan
; atau langkah manual apa pun di server (lihat Dockerfile: CMD memanggil
; supervisord ini, bukan php-fpm langsung).
;
; Tanpa ini, job yang di-dispatch ke queue (mis. GenerateWordReportJob) tidak
; akan pernah diproses di production -- persis gejala "pending selamanya"
; yang sama seperti kalau `php artisan queue:work` tidak jalan di lokal.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
; --max-time=3600: worker restart sendiri tiap 1 jam (cegah memory creep pada
; proses PHP long-running) -- autorestart=true di bawah langsung
; menyalakannya lagi, baik karena --max-time maupun crash beneran.
command=php artisan queue:work --tries=2 --sleep=3 --max-time=3600
directory=/var/www/ecosystem
user=www-data
autostart=true
autorestart=true
priority=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
